<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarif Kutusu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="marka">Tarif <span class="cizik">Kutusu</span></div>
  <div class="alt-baslik">yemek &amp; tatlı tarifleri</div>
</header>

<div class="kap">
  <div class="on-kapak-hizmet">
    <a href="ekle.html" class="btn">+ Yeni Tarif Ekle</a>
  </div>

  <div class="arama-satiri">
    <input type="search" id="arama" placeholder="Tarif ara...">
  </div>

  <nav class="raf" id="kategoriRaf">
    <button class="aktif" data-kategori="">Tümü</button>
  </nav>

  <div id="izgaraAlani"></div>
</div>

<footer class="site-footer">tarifler bu tarayıcıda saklanır · offline çalışır</footer>

<script src="db.js"></script>
<script>
let TUM_TARIFLER = [];
let AKTIF_KATEGORI = '';

async function baslat(){
  TUM_TARIFLER = await tkTumu();
  const kategoriler = await tkKategoriler();
  const raf = document.getElementById('kategoriRaf');
  kategoriler.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.dataset.kategori = k;
    b.addEventListener('click', () => secKategori(k, b));
    raf.appendChild(b);
  });
  raf.querySelector('button[data-kategori=""]').addEventListener('click', (e) => secKategori('', e.target));
  document.getElementById('arama').addEventListener('input', ciz);
  ciz();
}

function secKategori(k, btn){
  AKTIF_KATEGORI = k;
  document.querySelectorAll('.raf button').forEach(b => b.classList.remove('aktif'));
  btn.classList.add('aktif');
  ciz();
}

function ciz(){
  const alan = document.getElementById('izgaraAlani');
  const arananMetin = document.getElementById('arama').value.trim().toLocaleLowerCase('tr');
  let liste = TUM_TARIFLER;
  if (AKTIF_KATEGORI) liste = liste.filter(t => t.kategori === AKTIF_KATEGORI);
  if (arananMetin) liste = liste.filter(t => t.baslik.toLocaleLowerCase('tr').includes(arananMetin));

  if (liste.length === 0){
    alan.innerHTML = `<div class="bos-durum">
      <div class="buyuk">${TUM_TARIFLER.length === 0 ? 'Kutu henüz boş' : 'Eşleşen tarif yok'}</div>
      <div>${TUM_TARIFLER.length === 0 ? 'İlk tarifini eklemek için yukarıdaki butona dokun.' : 'Farklı bir kategori ya da arama dene.'}</div>
    </div>`;
    return;
  }

  alan.innerHTML = `<div class="kart-izgara">${liste.map(kartHTML).join('')}</div>`;
}

function kartHTML(t){
  const gorsel = t.kapak
    ? `<img class="gorsel" src="${t.kapak}" alt="${t.baslik}">`
    : `<div class="gorsel-yok">görsel yok</div>`;
  const metaBits = [];
  if (t.sure) metaBits.push(t.sure + ' dk');
  if (t.porsiyon) metaBits.push(t.porsiyon + ' porsiyon');
  return `<a class="tarif-kart" href="tarif.html?id=${t.id}">
    ${gorsel}
    <div class="icerik">
      <div class="etiket">${t.kategori || 'Diğer'}</div>
      <h3>${t.baslik}</h3>
      ${metaBits.length ? `<div class="meta"><span>${metaBits.join(' · ')}</span></div>` : ''}
    </div>
  </a>`;
}

baslat();
</script>
</body>
</html>
